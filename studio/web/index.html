<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plan studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">plan <span>studio</span></div>
  <label class="work-pick">企画
    <select id="workSel"><option value="">— 選ぶ —</option></select>
  </label>
  <button class="ghost" id="newWorkBtn" type="button">新しい企画</button>
  <div class="spacer"></div>
  <div class="meter" id="meter" tabindex="0" aria-describedby="meterTip">
    <span class="meter-label">これまでの費用</span>
    <strong id="meterTotal">$0.0000</strong>
    <div class="meter-tip" id="meterTip" role="tooltip"></div>
  </div>
  <div class="keystate" id="keyState"></div>
</header>

<div class="shell">
  <main id="main" tabindex="-1">
    <section id="empty" class="panel">
      <h1>商品・サービスを企画する</h1>
      <p class="lede">テーマ（ジャンル・顧客層・コンセプト・開発規模・調査事項）を入れて複数のモデルに企画の素案を出させ、似た案と外れた案を見分け、選んだ案から企画原案を作ります。原案は、PowerPoint の Copilot・Claude・ChatGPT・Gemini に渡せる企画書のたたきにまで進めます。</p>
      <p>上の「新しい企画」から始めるか、企画を選んでください。</p>
    </section>
    <section id="panel-theme" class="panel" hidden></section>
    <section id="panel-propose" class="panel" hidden></section>
    <section id="panel-classify" class="panel" hidden></section>
    <section id="panel-draft" class="panel" hidden></section>
    <section id="panel-deck" class="panel" hidden></section>
  </main>

  <nav class="rail" aria-label="工程">
    <ol id="rail">
      <li data-stage="theme"><button type="button"><b>一</b>テーマ</button></li>
      <li data-stage="propose"><button type="button"><b>二</b>提案</button></li>
      <li data-stage="classify"><button type="button"><b>三</b>分類・選ぶ</button></li>
      <li data-stage="draft"><button type="button"><b>四</b>企画原案</button></li>
      <li data-stage="deck"><button type="button"><b>五</b>企画書たたき</button></li>
    </ol>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script src="app.js"></script>
</body>
</html>
